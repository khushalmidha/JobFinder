<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lever Application - Fullstack SDE</title>
</head>
<body>
  <div class="application-page">
    <div class="posting-headline">
      <h2>Fullstack Software Development Engineer</h2>
    </div>

    <form id="application-form" action="/apply" method="POST">
      <div class="application-question">
        <label>Full name <span class="required">*</span></label>
        <input type="text" name="name" required />
      </div>

      <div class="application-question">
        <label>Email <span class="required">*</span></label>
        <input type="email" name="email" required />
      </div>

      <div class="application-question">
        <label>Phone <span class="required">*</span></label>
        <input type="tel" name="phone" required />
      </div>

      <div class="application-question">
        <label>Current company</label>
        <input type="text" name="org" />
      </div>

      <div class="application-question">
        <label>LinkedIn URL</label>
        <input type="text" name="urls[LinkedIn]" />
      </div>

      <div class="application-question">
        <label>GitHub URL</label>
        <input type="text" name="urls[GitHub]" />
      </div>

      <div class="application-question">
        <label>Expected CTC (in LPA) <span class="required">*</span></label>
        <input type="text" name="custom_expected_ctc_lpa" required />
      </div>

      <div class="application-question">
        <label>Additional Information</label>
        <textarea name="comments" placeholder="Add a cover note or details..."></textarea>
      </div>

      <!-- Final Submit Button - MUST NEVER BE CLICKED! -->
      <div class="form-submit">
        <button type="submit" class="template-btn-submit" id="lever-submit-btn">Apply Now</button>
      </div>
    </form>
  </div>
</body>
</html>
