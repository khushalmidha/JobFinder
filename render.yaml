services:
  # Backend API with Automated 3-Time Daily Scraper Daemon
  - type: web
    name: jobfinder-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://jobfinder-backend.onrender.com
      - key: FRONTEND_URL
        value: https://jobfinder-web.onrender.com

  # Frontend Web Dashboard
  - type: web
    name: jobfinder-web
    env: static
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jobfinder-backend.onrender.com/api
