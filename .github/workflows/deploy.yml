name: Deploy JobFinder to existing EC2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobfinder-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
            extension/package-lock.json
      - run: npm ci && npm test
        working-directory: backend
      - run: npm ci && npm run build && npm run lint
        working-directory: web
      - run: npm ci && npm run build && npm run lint
        working-directory: extension
      - run: npx playwright install --with-deps chromium && npm run test:browser
        working-directory: backend
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require existing host credentials
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
          FINGERPRINT: ${{ secrets.EC2_SSH_FINGERPRINT }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$FINGERPRINT" || { echo 'Configure existing EC2 host/user/key/fingerprint secrets first'; exit 1; }
      - name: Deploy tested commit to existing EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -eu
            if [ -d "$HOME/JobFinder/.git" ]; then cd "$HOME/JobFinder";
            elif [ -d "$HOME/jobfinder/.git" ]; then cd "$HOME/jobfinder";
            else echo 'Existing JobFinder checkout not found'; exit 1; fi
            test -z "$(git status --porcelain --untracked-files=no)" || { echo 'Tracked host edits detected; reconcile before deployment'; exit 1; }
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA" || { echo 'Newer main exists; dispatch latest deployment'; exit 1; }
            git checkout --detach "$DEPLOY_SHA"
            sh ops/deploy-existing.sh
