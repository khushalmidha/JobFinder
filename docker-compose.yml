services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MAIL_RETENTION_ENABLED: ${MAIL_RETENTION_ENABLED:-false}
      MAIL_RETENTION_USER_IDS: ${MAIL_RETENTION_USER_IDS:-}
      MAIL_RETENTION_ALLOW_GLOBAL: "false"
      OUTREACH_MAX_DAILY: "450"
      OUTREACH_GLOBAL_MAX_DAILY: "450"
      OUTREACH_SENDING_ENABLED: "false"
      OUTREACH_WORKER_ENABLED: "false"
      EMAIL_VERIFICATION_ENABLED: "false"
      ACCESS_NOTIFICATION_SENDING_ENABLED: "false"
      MAIL_STATUS_WEBHOOK_ENABLED: "false"
      JOB_SCHEDULER_ENABLED: "false"
      RESEARCH_SCHEDULER_ENABLED: "false"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  web:
    build: ./web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  ingress:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JOBFINDER_DOMAIN: ${JOBFINDER_DOMAIN:?Set verified public hostname in root .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
