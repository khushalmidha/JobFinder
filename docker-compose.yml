version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobfinder-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://khushalmidha:7H5qXGxJ03vfYt9A@cluster0.qyi5j.mongodb.net/jobfinder}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_jobfinder2026}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jobfinder-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

